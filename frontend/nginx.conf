events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types; # Include the mime.types file

    server {
        listen 5173;
        server_name localhost;

        root /usr/share/nginx/html;

        # Proxy API requests to the backend so the app can use relative URLs
        location /search {
            proxy_pass http://fastapi-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s; # the research agent can take a while
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Explicitly set MIME type for JavaScript files
        location ~* \.js$ {
            types { application/javascript js; }
            try_files $uri =404;
        }
    }
}
