services:
  fastapi-backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --reload --port 8000
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    environment:
      - MODULE_NAME=app.main
      - VARIABLE_NAME=app

  react-frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY=http://fastapi-backend:8000
    depends_on:
      - fastapi-backend